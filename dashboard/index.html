<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>localmem</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar: brand + tab nav + live status -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-name">localmem</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-tab="home"><span class="ni">▦</span> Home</button>
        <button class="nav-item" data-tab="memory"><span class="ni">◑</span> Memory</button>
        <button class="nav-item" data-tab="graph"><span class="ni">⬡</span> Graph</button>
        <button class="nav-item" data-tab="brain"><span class="ni">✦</span> Brain</button>
        <button class="nav-item" data-tab="trust"><span class="ni">⎙</span> Trust</button>
      </nav>

      <div class="sidebar-foot">
        <div class="status" id="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">connecting…</span>
        </div>
        <div class="ver" id="version"></div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="search">
          <span class="search-ic">⌕</span>
          <input id="globalSearch" type="search" placeholder="Search memory…  (hybrid: keyword + meaning)" autocomplete="off" />
        </div>
        <div class="topbar-right">
          <select id="projectSelect" class="select" title="Scope to a project"></select>
          <button id="themeBtn" class="btn" title="Toggle light / dark">☾</button>
          <button id="refreshBtn" class="btn" title="Refresh">⟲</button>
        </div>
      </header>

      <section id="view" class="view"><div class="loading">Loading…</div></section>
    </main>
  </div>

  <!-- Slide-over detail panel -->
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <span id="drawerTitle">Detail</span>
      <button class="btn ghost" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/layout-base.js"></script>
  <script src="vendor/cose-base.js"></script>
  <script src="vendor/cytoscape-fcose.js"></script>
  <script src="app.js"></script>
</body>
</html>
